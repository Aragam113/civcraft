# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Use local Temurin JDK 21 (installed for this project).
org.gradle.java.home=C:/Users/fajar/AppData/Local/jdk-21

# Moderate timeouts — long enough for Mojang CDN downloads but short enough
# to fail fast on DPI-throttled fabricmc.net requests so we notice.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.2
loom_version=1.13.3

# Mod Properties
mod_version=0.1.0
maven_group=com.civcraft

# Dependencies
fabric_api_version=0.141.3+1.21.11